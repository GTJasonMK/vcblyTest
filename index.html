<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研词汇随机测试</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
    <!-- 首页面板 -->
  <div class="panel active" id="panel-home">
    <div class="home-header">
      <h1>考研词汇随机测试</h1>
      <div class="subtitle">红宝书</div>
    </div>

    <!-- 统计摘要栏 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-chip">
        <div class="sc-val" id="scTotalTests">0</div>
        <div class="sc-lbl">测试次数</div>
      </div>
      <div class="stat-chip">
        <div class="sc-val" id="scTotalWords">0</div>
        <div class="sc-lbl">累计测词</div>
      </div>
      <div class="stat-chip">
        <div class="sc-val" id="scWrongWords">0</div>
        <div class="sc-lbl">收录生词</div>
      </div>
    </div>

    <!-- 恢复测试横幅 -->
    <div class="resume-banner" id="resumeBanner" style="display:none">
      <div class="resume-info">
        <span class="resume-icon">⏳</span>
        <span id="resumeInfo">有未完成的测试</span>
      </div>
      <button class="btn btn-accent btn-sm" onclick="resumeSession()">继续测试</button>
    </div>

    <!-- 双卡片入口 -->
    <div class="home-cards">
      <div class="home-card" id="homeTestCard">
        <div class="home-card-icon">📖</div>
        <h3>开始测试</h3>
        <p class="home-card-desc">随机抽取 · 四选一 · 错词收入今日单词本</p>
        <div class="setting-row">
          <label for="maxUnknown">错词上限</label>
          <input type="number" id="maxUnknown" value="20" min="1" max="200">
          <span class="setting-unit">个</span>
        </div>
        <button class="btn btn-primary btn-block" onclick="startSession()">开始测试</button>
      </div>

      <div class="home-card" id="homeNotebookCard">
        <div class="home-card-icon">📊</div>
        <h3>错词本</h3>
        <p class="home-card-desc" id="homeNotebookSummary">暂无测试记录</p>
        <div class="nb-mini-preview" id="nbMiniPreview"></div>
        <button class="btn btn-secondary btn-block" onclick="showPanel('notebook')">进入错词本</button>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="nav-links">
      <button class="nav-link" onclick="showPanel('history')">历史记录</button>
      <span class="nav-divider">·</span>
      <button class="nav-link" onclick="resetAll()">重置数据</button>
    </div>
  </div>

  <!-- 测试面板 -->
  <div class="panel" id="panel-test">
    <div class="test-body">
      <!-- 左栏：状态信息 + 单词 -->
      <div class="test-left">
        <div class="test-meta-top">
          <span class="test-counter" id="testCounter">第 1 题</span>
          <button class="nav-link" onclick="endSessionEarly()">提前结束</button>
        </div>

        <div class="word-card-large">
          <div class="word-display" id="wordText"></div>
          <div class="pron-display">
            <span class="uk" id="pronUk"></span>
            <span class="us" id="pronUs"></span>
          </div>
          <div class="def-reveal" id="defText"></div>
        </div>

        <div class="test-meta-bottom">
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
          </div>
          <div class="progress-text" id="progressText">准备开始…</div>
        </div>
      </div>

      <!-- 右栏：选项 + 操作 -->
      <div class="test-right">
        <div class="options-grid" id="optionsGrid"></div>

        <div class="next-btn-wrap" id="nextBtn" style="display:none">
          <button class="btn btn-primary btn-lg" onclick="nextWord()">
            下一题 <span class="next-key-hint">Space</span>
          </button>
          <span class="key-hints-inline"><kbd>1</kbd>-<kbd>4</kbd> 选择 · <kbd>Space</kbd> 下一题</span>
        </div>
      </div>
    </div>
  </div>

<!-- 结果面板 -->
  <div class="panel" id="panel-result">
    <h2 style="margin-bottom:4px">今日测试完成</h2>
    <p style="color:var(--text-light);font-size:0.9rem" id="resultDate"></p>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-num" id="statTested">0</div>
        <div class="stat-label">测试单词数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statCorrect">0</div>
        <div class="stat-label">正确</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statUnknown">0</div>
        <div class="stat-label">今日不会的</div>
      </div>
    </div>

    <h3 style="margin:20px 0 8px;text-align:left">今日错词本</h3>
    <div class="word-list" id="todayWordList"></div>

    <div style="margin-top:20px">
      <button class="btn btn-secondary btn-sm" onclick="startReview()">复习今日错词</button>
      <button class="btn btn-primary btn-sm" onclick="startSession()" style="margin-left:10px">开始新一轮</button>
    </div>

    <div class="nav-links" style="margin-top:18px">
      <button class="nav-link" onclick="showPanel('history')">查看历史记录</button>
      <button class="nav-link" onclick="showPanel('home')">返回首页</button>
    </div>
  </div>

  <!-- 复习面板 -->
  <div class="panel" id="panel-review">
    <h3 style="margin-bottom:16px">复习今日错词</h3>
    <div class="review-card">
      <div class="word-display" id="reviewWord"></div>
      <div class="pron-display">
        <span class="uk" id="reviewPronUk"></span>
        <span class="us" id="reviewPronUs"></span>
      </div>
      <div class="def-reveal show" id="reviewDef"></div>
    </div>
    <div class="review-nav">
      <button class="nav-btn" onclick="reviewPrev()">◀</button>
      <span class="review-index" id="reviewIndex">1 / 1</span>
      <button class="nav-btn" onclick="reviewNext()">▶</button>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="showPanel('result')">返回错词本</button>
  </div>

      <!-- 错词本面板 -->
  <div class="panel" id="panel-notebook">
    <!-- 顶部栏 -->
    <div class="nb-topbar">
      <button class="nav-link" onclick="showPanel('home')">← 返回</button>
      <h3 style="margin:0">错词本</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="exportNotebook()">导出</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">导入</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importNotebook(event)">
      </div>
    </div>

	    <!-- 卡片1：日历 / 成长趋势（Tab切换） -->
	    <div class="nb-card" id="nbCardTop">
	      <div class="nb-card-header">
	        <div class="nb-tabs">
	          <button class="nb-tab active" id="nbTabCal" onclick="switchNbTab('cal')">📅 测试日历</button>
	          <button class="nb-tab" id="nbTabChart" onclick="switchNbTab('chart')">📈 成长趋势</button>
	        </div>
	        <span class="nb-card-sub" id="nbCalRange"></span>
	      </div>
	      <div class="nb-tab-content active" id="nbTabContentCal">
	        <div class="nb-calendar" id="nbCalendar"></div>
	      </div>
	      <div class="nb-tab-content" id="nbTabContentChart" style="display:none">
	        <div class="nb-chart-wrap">
	          <canvas id="nbChart"></canvas>
	          <p class="nb-chart-summary" id="nbChartSummary"></p>
	        </div>
	      </div>
	    </div>

		    <!-- 卡片2：选中日期错词回顾 -->
		    <div class="nb-card" id="nbCardReview">
		      <div class="nb-card-header">
		        <span class="nb-card-title" id="nbReviewTitle">📋 选择日期查看错词</span>
		      </div>
		      <!-- 顶栏：测试次数选择 -->
		      <div class="nb-session-tabs" id="nbSessionTabs"></div>
		      <!-- 下方：左右分栏 -->
		      <div class="nb-review-split" id="nbReviewSplit">
		        <div class="nb-review-left" id="nbReviewLeft">
		          <p class="nb-empty-hint">点击日历中的日期查看详情</p>
		        </div>
		        <div class="nb-review-right" id="nbReviewRight">
		          <p class="nb-empty-hint">点击错词查看释义</p>
		        </div>
		      </div>
		    </div>
  </div>

<!-- 历史面板 -->
  <div class="panel" id="panel-history">
    <h3 style="margin-bottom:16px">历史记录</h3>
    <div class="history-list" id="historyList">
      <p style="color:var(--text-light)">暂无记录</p>
    </div>
    <div class="nav-links" style="margin-top:20px">
      <button class="nav-link" onclick="showPanel('home')">返回首页</button>
      <button class="nav-link" onclick="clearHistory()">清空历史</button>
    </div>
  </div>
</div>

<!-- 主题切换按钮 -->
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换暗色/亮色主题">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<script src="data/words_data.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
